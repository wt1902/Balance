<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 640" width="1280" height="640" font-family="Roboto, sans-serif">
  <!-- Source of banner.png; render with branding/render.sh (needs resvg). -->
  <defs>
    <radialGradient id="bg" cx="70%" cy="45%" r="85%">
      <stop offset="0" stop-color="#25594c"/>
      <stop offset="1" stop-color="#0c241e"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8f7b"/>
      <stop offset="1" stop-color="#1f5245"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26b3a3"/>
      <stop offset="0.5" stop-color="#a2f2d8"/>
      <stop offset="1" stop-color="#f4511e"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#04120e" flood-opacity="0.7"/>
    </filter>
    <clipPath id="iconClip"><rect x="72" y="88" width="120" height="120" rx="28"/></clipPath>
    <clipPath id="desktopClip"><rect x="708" y="140" width="538" height="378" rx="6"/></clipPath>
    <clipPath id="phoneClip"><rect x="620" y="182" width="203" height="439" rx="24"/></clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <ellipse cx="930" cy="340" rx="300" ry="210" fill="#39b997" opacity="0.25" filter="url(#glow)"/>

  <!-- left: identity -->
  <image x="72" y="88" width="120" height="120" xlink:href="../assets/app_icon.png" clip-path="url(#iconClip)"/>
  <text x="68" y="306" font-size="84" font-weight="700" fill="#ffffff">Баланс</text>
  <rect x="74" y="330" width="120" height="6" rx="3" fill="url(#accent)"/>
  <text x="72" y="384" font-size="28" font-weight="500" fill="#a2f2d8">Личные финансы · Flutter · Material 3</text>
  <text x="72" y="428" font-size="22" fill="#9cc4b6">Работает локально, синхронизируется</text>
  <text x="72" y="458" font-size="22" fill="#9cc4b6">с вашим self-hosted BalanceServer</text>

  <g font-size="18" font-weight="500" fill="#dff7ee">
    <rect x="72" y="494" width="104" height="36" rx="18" fill="#173f35" stroke="#3f7d6b"/>
    <text x="124" y="518" text-anchor="middle">Android</text>
    <rect x="186" y="494" width="104" height="36" rx="18" fill="#173f35" stroke="#3f7d6b"/>
    <text x="238" y="518" text-anchor="middle">iOS/iPad</text>
    <rect x="300" y="494" width="88" height="36" rx="18" fill="#173f35" stroke="#3f7d6b"/>
    <text x="344" y="518" text-anchor="middle">macOS</text>
    <rect x="72" y="540" width="104" height="36" rx="18" fill="#173f35" stroke="#3f7d6b"/>
    <text x="124" y="564" text-anchor="middle">Windows</text>
    <rect x="186" y="540" width="88" height="36" rx="18" fill="#173f35" stroke="#3f7d6b"/>
    <text x="230" y="564" text-anchor="middle">Linux</text>
    <rect x="284" y="540" width="72" height="36" rx="18" fill="#173f35" stroke="#3f7d6b"/>
    <text x="320" y="564" text-anchor="middle">Web</text>
  </g>

  <!-- right: desktop window with a real screenshot -->
  <g filter="url(#shadow)">
    <rect x="700" y="100" width="554" height="426" rx="16" fill="url(#frame)"/>
  </g>
  <circle cx="722" cy="120" r="6" fill="#ff8a5c"/>
  <circle cx="742" cy="120" r="6" fill="#f2c14f"/>
  <circle cx="762" cy="120" r="6" fill="#39b997"/>
  <image x="708" y="140" width="538" height="378" xlink:href="../docs/desktop.png" clip-path="url(#desktopClip)"/>

  <!-- phone with a real screenshot, in front of the desktop -->
  <g filter="url(#shadow)">
    <rect x="608" y="170" width="227" height="463" rx="34" fill="url(#frame)"/>
  </g>
  <image x="620" y="182" width="203" height="439" xlink:href="../docs/mobile.png" clip-path="url(#phoneClip)"/>
</svg>
